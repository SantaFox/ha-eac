name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-run weekly so we catch breakage from upstream changes (HA core,
    # HACS rules) even when our own code hasn't changed.
    - cron: "23 4 * * 1"

jobs:
  hassfest:
    name: Home Assistant manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
